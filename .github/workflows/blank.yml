# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica os SVGs na branch `output` (usada pelo README).
name: Snake Game

on:
  # Atualiza todo dia (o gráfico de contribuições muda no máximo uma vez por dia).
  schedule:
    - cron: "17 3 * * *"

  # Permite rodar manualmente pela aba Actions.
  workflow_dispatch:

  # Regera sempre que algo for enviado para a main.
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A v3 lê as contribuições pela API GraphQL do GitHub.
      # (A versão antiga, @master, raspava o HTML do perfil e passou a gerar uma grade vazia.)
      # As células usam as cores do gráfico de contribuições do GitHub no tema escuro,
      # num SVG só: assim a grade não depende do tema do sistema de quem visita.
      - name: Gerar SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#d83b7d&color_dots=#151b23,#033a16,#196c2e,#2ea043,#56d364

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
